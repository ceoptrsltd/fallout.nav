<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>fallout.nav</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%235dff8a' d='M12 2 4.5 20.3 12 17l7.5 3.3z'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0f120e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="fallout.nav">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="stylesheet" href="css/app.css">
  <!-- Everything the first screen needs is asked for at once, next to the stylesheet, instead of one step of the import
       chain (and of the stylesheet's fonts) after another: over a mobile link every step is a round trip.
       The lists follow the modules' imports: tests/admin/preload.test.mjs fails when they drift. -->
  <link rel="preload" as="font" type="font/ttf" href="../display/ui/fonts/BlackOpsOne-Regular.ttf" crossorigin>
  <link rel="preload" as="font" type="font/ttf" href="../display/ui/fonts/RussoOne-Regular.ttf" crossorigin>
  <link rel="preload" as="font" type="font/ttf" href="../display/ui/fonts/Oswald-wght.ttf" crossorigin>
  <!-- preload: shell -->
  <link rel="modulepreload" href="js/dom.js">
  <link rel="modulepreload" href="js/api.js">
  <link rel="modulepreload" href="js/push.js">
  <link rel="modulepreload" href="js/store.js">
  <link rel="modulepreload" href="js/ui.js">
  <link rel="modulepreload" href="js/conn-fmt.js">
  <link rel="modulepreload" href="js/preview.js">
  <link rel="modulepreload" href="js/install.js">
  <link rel="modulepreload" href="js/app-login.js">
  <link rel="modulepreload" href="js/version-fmt.js">
  <link rel="modulepreload" href="js/devtime.js">
  <link rel="modulepreload" href="js/alarm-fmt.js">
  <link rel="modulepreload" href="js/hist-fmt.js">
  <link rel="modulepreload" href="js/tracking-fmt.js">
  <link rel="modulepreload" href="js/install-fmt.js">
  <!-- /preload -->
  <script>
    // "Install app" (js/install.js): keep the browser's install prompt even if it fires before the modules run
    window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); window.fnavInstallEvent = e; });
    // The page the address asks for (the Dashboard without one): its module now — shell.js imports it only after
    // the session and the settings have answered. The Dashboard, where the app starts, with all it imports.
    (function () {
      var PAGES = "dashboard alarm tracking camera recordings radio bluetooth air nav compass level tuner gps controls system".split(" ");
      var DASHBOARD = "js/rec-play.js js/snap-view.js js/air-fmt.js js/air-chart.js js/power-controls.js js/dash-fmt.js js/slide-switch.js js/level-fmt.js js/radio-fmt.js".split(" ");
      var id = (location.hash.match(/^#\/([\w-]+)/) || [])[1];
      if (PAGES.indexOf(id) < 0) id = "dashboard";
      ["js/pages/" + id + ".js"].concat(id === "dashboard" ? DASHBOARD : []).forEach(function (href) {
        var l = document.createElement("link");
        l.rel = "modulepreload";
        l.href = href;
        document.head.appendChild(l);
      });
    })();
  </script>
</head>
<body>
  <div id="app">
    <aside class="side">
      <div class="brand">FALLOUT.NAV<small>dashcam &amp; navigation</small></div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <button class="btn sm" id="logout" type="button">Log out</button>
      </div>
    </aside>
    <div class="main">
      <header class="statusbar" id="statusbar"></header>
      <main id="view"></main>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <noscript>JavaScript is required.</noscript>
  <script type="module" src="js/shell.js"></script>
  <!-- guest (read-only) session: badge, banner, disabled controls -->
  <script type="module" src="js/guest.js"></script>
</body>
</html>
