<!doctype html>
<!-- Service test patterns for the composite / PAL output.
     ?mode=bw    full white / full black alternating every 5 s (DC level check with a multimeter)
     ?mode=seq   15 s white -> 15 s black -> 15 s bars, repeating
     ?mode=white | black   static full-screen level
     ?mode=bars  grey bars + geometry grid + circles (picture check on the RV-50)
     Shown by fnav-display when FNAV_DISPLAY_URL in /etc/fnav/display.env points here. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>fallout.nav — test pattern</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; cursor: none; background: #000; }
  #lvl { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
         font: bold 64px/1 sans-serif; letter-spacing: .05em; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="lvl" hidden></div>
<canvas id="c" width="720" height="576" hidden></canvas>
<script>
const params = new URLSearchParams(location.search);
const mode = params.get("mode") || "bw";
const clean = params.get("clean") === "1";   // pure full-screen colour, no label at all
const dim = parseFloat(params.get("dim") || "1");   // ?dim=0.5 - whole picture darker (average picture level test)
if (dim < 1) document.documentElement.style.filter = `brightness(${dim})`;
if (params.get("mirror") === "1") document.documentElement.style.transform = "scaleX(-1)";  // for monitors that mirror
const lvl = document.getElementById("lvl");
const c = document.getElementById("c"), g = c.getContext("2d");

function level(white, label) {
  c.hidden = true; lvl.hidden = clean;
  document.body.style.background = white ? "#fff" : "#000";
  lvl.style.color = white ? "#ddd" : "#222";   // label barely visible: keeps the average level ~pure
  lvl.textContent = clean ? "" : label;
}

function bars() {
  lvl.hidden = true; c.hidden = false; document.body.style.background = "#000";
  const W = 720, H = 576;
  const greys = [255, 223, 191, 159, 127, 95, 63, 0];
  greys.forEach((v, i) => { g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(i * W / 8, 0, W / 8 + 1, H * 0.6); });
  g.fillStyle = "#000"; g.fillRect(0, H * 0.6, W, H * 0.4);
  g.strokeStyle = "#fff"; g.lineWidth = 2;
  for (let x = 0; x <= W; x += 72) { g.beginPath(); g.moveTo(x, H * 0.6); g.lineTo(x, H); g.stroke(); }
  for (let y = H * 0.6; y <= H; y += 57.6) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  // a circle drawn with the PAL pixel aspect (720 px squeezed into 4:3): must look round on the CRT
  g.lineWidth = 4;
  g.beginPath(); g.ellipse(W / 2, H * 0.8, 100 * 0.9375, 100, 0, 0, 2 * Math.PI); g.stroke();
  g.strokeStyle = "#888"; g.strokeRect(36, 29, W - 72, H - 58);   // 5% safe area
  g.fillStyle = "#fff"; g.font = "bold 28px sans-serif"; g.fillText("fallout.nav PAL 720x576", 40, H * 0.6 + 40);
}

if (mode === "frame") {
  // overscan ruler: nested frames every 5 % of the real output size, numbered on every side
  lvl.hidden = true; c.hidden = false; document.body.style.background = "#000";
  const W2 = innerWidth || 720, H2 = innerHeight || 576;
  c.width = W2; c.height = H2; c.style.width = W2 + "px"; c.style.height = H2 + "px";
  g.fillStyle = "#000"; g.fillRect(0, 0, W2, H2);
  g.textAlign = "center"; g.textBaseline = "middle";
  for (let p = 0; p <= 25; p += 5) {
    const x = W2 * p / 100, y = H2 * p / 100;
    g.strokeStyle = p % 10 === 0 ? "#fff" : "#999"; g.lineWidth = p === 0 ? 4 : 2;
    g.strokeRect(x + 1, y + 1, W2 - 2 * x - 2, H2 - 2 * y - 2);
    g.fillStyle = "#fff"; g.font = "bold 22px sans-serif";
    const t = String(p);
    g.fillText(t, W2 / 2, y + 16);            // top
    g.fillText(t, W2 / 2, H2 - y - 16);       // bottom
    g.fillText(t, x + 18, H2 / 2);            // left
    g.fillText(t, W2 - x - 18, H2 / 2);       // right
  }
  g.font = "bold 26px sans-serif"; g.fillText("TOP", W2 / 2, H2 * 0.32); g.fillText("LEFT", W2 * 0.33, H2 / 2);
} else if (mode === "nav") {
  // the real navigation screen inside a full-screen frame (with ?dim= applied on top) - test only
  const f = document.createElement("iframe");
  f.src = "/display/?pal=1";
  f.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:0;background:#000";
  document.body.appendChild(f);
} else if (mode === "bars") bars();
else if (mode === "white" || mode === "black") level(mode === "white", mode.toUpperCase());
else if (mode === "seq") {
  // 15 s white -> 15 s black -> 15 s bars, forever (tells our signal apart from the monitor's own behaviour)
  let step = 0, left = 15;
  const show = () => {
    if (step === 0) level(true, "WHITE " + left);
    else if (step === 1) level(false, "BLACK " + left);
    else if (left === 15) bars();
    if (--left <= 0) { step = (step + 1) % 3; left = 15; }
  };
  show(); setInterval(show, 1000);
} else {
  let white = true, n = 5;
  const tick = () => {
    level(white, (white ? "WHITE " : "BLACK ") + n);
    if (--n <= 0) { white = !white; n = 5; }
  };
  tick(); setInterval(tick, 1000);
}
</script>
</body>
</html>
