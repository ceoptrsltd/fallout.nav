<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fallout.nav — display</title>
  <link rel="icon" href="data:,">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    body.preview { background: transparent; }
    /* устройство: окно Chromium 720×576, холст 768×576 сжат по горизонтали */
    body.pal { width: 720px; height: 576px; cursor: none; }
    #root {
      position: absolute;
      left: 0;
      top: 0;
      width: 768px;
      height: 576px;
      overflow: hidden;
      background: #000;
      transform-origin: 0 0;
      contain: strict;
      user-select: none;
    }
    #root > canvas, #camera-layer {
      position: absolute;
      left: 0;
      top: 0;
      width: 768px;
      height: 576px;
    }
    #camera-layer {
      background: #000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 300ms ease, visibility 0s linear 300ms;
      pointer-events: none;
    }
    #camera-layer.on {
      opacity: 1;
      visibility: visible;
      transition: opacity 300ms ease, visibility 0s;
    }
    #camera {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    #camera-msg {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 10px 24px;
      font: bold 36px "DejaVu Sans Mono", Consolas, monospace;
      letter-spacing: 2px;
      color: #e8f0e0;
      background: rgba(0, 0, 0, 0.8);
      border: 3px solid #e8f0e0;
      white-space: nowrap;
    }
    #camera-msg[hidden] { display: none; }
    /* меню игр (ui/games-menu.js): поверх карты, в координатах холста 768×576 */
    #games-menu {
      position: absolute; left: 0; top: 0; width: 768px; height: 576px; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.82);
      font-family: "FnavRusso", "Russo One", "Arial Black", sans-serif; color: #ecf7d8;
    }
    #games-menu[hidden] { display: none; }
    #games-menu .gm-panel {
      width: 610px; padding: 18px 26px 14px; background: #0a0c08;
      border: 4px solid #ecf7d8; outline: 2px solid rgba(236, 247, 216, 0.35); outline-offset: 6px;
    }
    #games-menu .gm-head {
      display: flex; align-items: baseline; justify-content: space-between;
      border-bottom: 3px solid #ecf7d8; padding-bottom: 8px; margin-bottom: 12px;
    }
    #games-menu .gm-title { font-family: "FnavStencil", "Black Ops One", sans-serif; font-size: 48px; letter-spacing: 4px; color: #ffc23d; }
    #games-menu .gm-sub, #games-menu .gm-foot, #games-menu .sys { font-family: "FnavOswald", "Oswald", "Arial Narrow", sans-serif; letter-spacing: 2px; }
    #games-menu .gm-sub { font-size: 25px; color: rgba(236, 247, 216, 0.6); }
    #games-menu .gm-list { list-style: none; margin: 0; padding: 0; }
    #games-menu .gm-list li { display: flex; align-items: center; height: 62px; padding: 0 12px; font-size: 32px; }
    #games-menu .gm-list .mark { width: 36px; }
    #games-menu .gm-list .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #games-menu .gm-list .sys { font-size: 25px; text-transform: uppercase; color: rgba(236, 247, 216, 0.6); margin-left: 12px; }
    #games-menu .gm-list li.sel { background: #ecf7d8; color: #0a0c08; }
    #games-menu .gm-list li.sel .sys { color: rgba(10, 12, 8, 0.7); }
    #games-menu .gm-msg { font-size: 30px; padding: 44px 10px; text-align: center; letter-spacing: 2px; }
    #games-menu .gm-msg.warn { background: #f2e7c4; color: #0a0c08; }
    #games-menu .gm-note {
      margin-top: 10px; padding: 4px 10px; background: #f2e7c4; color: #0a0c08; text-align: center;
      font-family: "FnavOswald", "Oswald", "Arial Narrow", sans-serif; font-size: 25px; letter-spacing: 2px;
    }
    #games-menu .gm-foot {
      display: flex; justify-content: space-between; margin-top: 14px; padding-top: 10px;
      border-top: 2px solid rgba(236, 247, 216, 0.35); font-size: 25px; color: rgba(236, 247, 216, 0.75);
    }
  </style>
</head>
<body>
  <div id="root">
    <canvas id="map" width="768" height="576"></canvas>
    <div id="camera-layer">
      <img id="camera" alt="">
      <div id="camera-msg" hidden>NO CAMERA</div>
    </div>
    <canvas id="hud" width="768" height="576"></canvas>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
