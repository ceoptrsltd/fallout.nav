<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fallout.nav — lightning around the power plate</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #16170f; color: #e7ecd6; font: 14px/1.4 system-ui, sans-serif; padding: 12px 16px 40px; }
  h2 { font-size: 16px; margin: 22px 0 6px; color: #ffc23d; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
  .muted { color: #a6ab96; }
  canvas { display: block; background: #000; border: 4px solid #2a2b24; border-radius: 8px; }
  canvas.full { width: 384px; height: 288px; }
  canvas.zoom { width: 520px; height: 260px; }
  body.bw canvas { filter: grayscale(1); }
  label { margin-right: 16px; user-select: none; }
</style>
</head>
<body>
<!--
  Variants of the lightning that runs around the power-stations plate (ui/lightning.js, ui/power.js).
  Each variant: the whole screen (half size) and a 2x close-up of the plate, animated in real time.
  ?t=<seconds> — a still at that time (every variant shows its burst at t mod period); ?bw=1 — grayscale.
-->
<div>
  <label><input type="checkbox" id="bw"> monochrome CRT (grayscale)</label>
  <label><input type="checkbox" id="chg" checked> lead battery charging</label>
  <label><input type="checkbox" id="pause"> pause</label>
  <span class="muted">Bursts repeat every 6–8 s; between them nothing is drawn.</span>
</div>
<div id="out"></div>
<script type="module">
import { loadUi } from "./index.js";
import { drawPower } from "./power.js";
import { LIGHTNING_VARIANTS, drawPlateLightning, lightningPhase } from "./lightning.js";

const W = 768, H = 576;
const SAFE = { x: W * 0.05, y: H * 0.05, w: W * 0.9, h: H * 0.9 };
const q = new URLSearchParams(location.search);
const bw = document.getElementById("bw"), chg = document.getElementById("chg"), pause = document.getElementById("pause");
bw.checked = q.get("bw") === "1";
const applyBw = () => document.body.classList.toggle("bw", bw.checked);
bw.onchange = applyBw;
applyBw();

function makeBg() {
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const g = c.getContext("2d");
  g.fillStyle = "#2c3a22"; g.fillRect(0, 0, W, H);
  let s = 7;
  const r = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
  for (let i = 0; i < 2600; i++) {
    const x = r() * W, y = r() * H, rad = 3 + r() * 16, k = r();
    g.fillStyle = k < 0.55 ? `rgba(20,35,14,${0.25 + r() * 0.4})` : k < 0.85 ? `rgba(70,90,50,${0.2 + r() * 0.3})` : `rgba(130,120,80,${0.15 + r() * 0.2})`;
    g.beginPath(); g.ellipse(x, y, rad, rad * (0.6 + r() * 0.6), r() * 3, 0, 7); g.fill();
  }
  g.fillStyle = "rgba(170,150,95,0.5)"; g.fillRect(300, 300, 220, 110);
  return c;
}

await loadUi();
const bg = makeBg();
const out = document.getElementById("out");
const views = LIGHTNING_VARIANTS.map((v) => {
  const sec = document.createElement("section");
  sec.innerHTML = `<h2>Variant ${v.id.toUpperCase()} — ${v.name}</h2><div class="muted">${v.note}</div>`;
  const row = document.createElement("div"); row.className = "row";
  const full = document.createElement("canvas"); full.width = W; full.height = H; full.className = "full";
  const zoom = document.createElement("canvas"); zoom.width = 520; zoom.height = 260; zoom.className = "zoom";
  row.append(full, zoom); sec.append(row); out.append(sec);
  const scene = document.createElement("canvas"); scene.width = W; scene.height = H;
  return { v, full, zoom, scene };
});

const state = (now) => ({
  now,
  telemetry: { power: {
    main: { soc_pct: 75.4, charging: false, low: false },
    second: { soc_pct: 8.6, voltage_v: 20.9, low: true },
    third: { soc_pct: 0, voltage_v: 3.1, charging: chg.checked, low: false },
  } },
  settings: { power: { show_on_screen: true } },
});

const still = q.has("t") ? Number(q.get("t")) : null;
let t0 = performance.now(), frozen = 0;
function frame(ts) {
  const now = still ?? (pause.checked ? frozen : (frozen = (ts - t0) / 1000));
  for (const { v, full, zoom, scene } of views) {
    const g = scene.getContext("2d");
    g.drawImage(bg, 0, 0);
    // каждый вариант со своим сдвигом времени — вспышки не одновременно
    const vt = now + LIGHTNING_VARIANTS.indexOf(v) * 1.7;
    const rect = drawPower(g, state(vt), SAFE);
    drawPlateLightning(g, rect, vt, v.id, { bounds: SAFE });
    full.getContext("2d").drawImage(scene, 0, 0);
    const z = zoom.getContext("2d");
    const sx = rect.x - 30, sy = rect.y - 40, sw = 260, sh = 130;
    z.imageSmoothingEnabled = false;
    z.drawImage(scene, sx, sy, sw, sh, 0, 0, 520, 260);
    zoom.title = lightningPhase(vt, v.id) ? "burst" : "idle";
  }
  if (still === null) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
