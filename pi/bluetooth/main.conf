# fallout.nav: BlueZ settings (/etc/bluetooth/main.conf), installed by pi/bin/fnav-sync-system.
# Everything not set here is the BlueZ default (the stock file only had comments).
#
# The onboard chip (CYW43455) has one radio for Wi-Fi, the speaker (A2DP) and the power stations (Bluetooth LE,
# docs/contracts/power.md "Радио"). The defaults are tuned for fast connecting, not for sharing:
#   - a search or a connect attempt listens all the time (100 % of the radio) - the music stutters;
#   - a new LE connection gets an event every 30-50 ms and a 0.42 s supervision timeout: on a busy radio the
#     station has ~0.3 s to answer, most attempts fail ("le-connection-abort-by-local") and links drop.
[General]

[LE]
# Scanning, units of 0.625 ms: listen 30 ms out of every 200 ms (15 % of the radio) while searching for a
# station and while connecting to one. A station advertises several times a second, it is still found in a
# second or two.
ScanIntervalDiscovery=320
ScanWindowDiscovery=48
ScanIntervalConnect=320
ScanWindowConnect=48
# New LE connections, units of 1.25 ms: an event every 400-500 ms (the stations are read once in 30 s), and
# 6 s without an answer before the link counts as lost (units of 10 ms). A station that asks for its own faster
# interval is slowed down again by pi/bin/fnav-ble-slow.
MinConnectionInterval=320
MaxConnectionInterval=400
ConnectionLatency=0
ConnectionSupervisionTimeout=600
