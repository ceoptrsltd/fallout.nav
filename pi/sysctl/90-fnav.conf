# fallout.nav: flush dirty pages to eMMC often.
# Video is written to eMMC as a stream, and the car can lose power at any moment (ignition, wiring).
# By default Linux keeps dirty pages for up to 30 s (dirty_expire_centisecs=3000) - on power loss
# that is seconds of lost video and a risk of filesystem damage.
# The recorder already calls fsync() once a second; these values are a safety net for everything
# else (journal, settings, tile cache). Units are hundredths of a second.

# How long a page may stay dirty before it must be written out: 1 s.
vm.dirty_expire_centisecs = 100
# How often the writeback thread wakes up: every 1 s.
vm.dirty_writeback_centisecs = 100
