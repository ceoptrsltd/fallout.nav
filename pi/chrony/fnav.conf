# fallout.nav: /etc/chrony/conf.d/fnav.conf
#
# The board has no RTC and the phone hotspot may be absent, so time comes from:
#  1) NTP pools (from /etc/chrony/chrony.conf and DHCP) - the main source, millisecond accuracy;
#  2) the GPS via gpsd (shared memory SHM 0, time from NMEA WITHOUT a PPS signal) - the fallback
#     when offline, accuracy about 0.1-0.5 s. That is plenty for video file names.
#
# How they coexist: chrony weighs sources by their uncertainty. The NMEA clock has a large one
# (precision/delay below), so with NTP available NTP wins and a disagreeing NMEA clock is rejected
# as a falseticker; offline the GPS is the only source left.
# 'noselect' is deliberately NOT set: otherwise there would be no time at all without internet.
refclock SHM 0 refid GPS precision 1e-1 offset 0.15 delay 0.2

# After power-up the clock can be arbitrarily wrong (no RTC) - step it whenever the offset is
# > 1 s, not only on the first 3 updates: a GPS fix may appear minutes after boot.
# install.sh comments out the "makestep" line in the main chrony.conf, otherwise it would override this one.
makestep 1 -1
