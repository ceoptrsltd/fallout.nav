# fallout.nav: RetroArch on the car screen. Copied to /var/lib/fnav/retroarch/retroarch.cfg on every start
# (pi/bin/fnav-games-run); anything not set here is RetroArch's default; nothing is saved back on exit.
config_save_on_exit = "false"

# Video: full screen under cage on the composite output (720x480, margins and mirror come from the system)
video_driver = "gl"
video_fullscreen = "true"
video_vsync = "true"
video_smooth = "false"
video_aspect_ratio_auto = "true"
video_scale_integer = "false"
video_font_size = "24.000000"
menu_driver = "rgui"
pause_nonactive = "false"

# Sound: the Bluetooth speaker (bluez-alsa, the most recently connected A2DP device); no speaker = silence
audio_driver = "alsa"
audio_device = "bluealsa"
audio_latency = "96"

# Gamepad: udev + our profile; left stick works as the D-pad too
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
joypad_autoconfig_dir = "/opt/fnav/app/pi/games/autoconfig"
input_player1_analog_dpad_mode = "1"
# PS = RetroArch menu; Start + Select = quit back to the navigation screen
input_menu_toggle_btn = "12"
input_quit_gamepad_combo = "4"
quit_press_twice = "false"
# Closing the game in the RetroArch menu = back to the navigation (not RetroArch's own main menu);
# kiosk mode hides settings, updaters and core loading
quit_on_close_content = "1"
kiosk_mode_enable = "true"

# Files: progress is saved and resumed automatically
libretro_directory = "/opt/fnav/games/cores"
libretro_info_path = "/usr/share/libretro/info"
system_directory = "/opt/fnav/games/system"
savefile_directory = "/var/lib/fnav/games/saves"
savestate_directory = "/var/lib/fnav/games/states"
savestate_auto_save = "true"
savestate_auto_load = "true"
menu_show_online_updater = "false"
menu_show_core_updater = "false"
