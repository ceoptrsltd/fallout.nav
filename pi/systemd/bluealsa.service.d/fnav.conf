# fallout.nav: the Pi only SENDS audio to a Bluetooth speaker (A2DP source); phones must not stream to it
# (no a2dp-sink). --keep-alive keeps the link up for a few seconds when mpv reopens the device
# (station change), so the speaker does not drop out and chime.
[Service]
ExecStart=
ExecStart=/usr/bin/bluealsa -S -p a2dp-source --keep-alive=10
