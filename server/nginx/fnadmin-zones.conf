# fallout.nav remote admin: login rate limits (http context; installed to /etc/nginx/conf.d/).
# Per client IP: 6 attempts a minute; all clients together: 30 a minute (the password is short).
limit_req_zone $binary_remote_addr zone=fnadmin_login:1m rate=6r/m;
limit_req_zone $server_name zone=fnadmin_login_all:1m rate=30r/m;
