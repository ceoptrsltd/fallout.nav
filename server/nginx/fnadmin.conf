# fallout.nav remote admin: https://<site>/fnadmin/  (docs/contracts/remote.md in the fallout.nav repo).
# Included into the site's HTTPS server block (tools/remote.sh setup); inherits its proxy_set_header lines
# (Host, X-Real-IP, X-Forwarded-*, Upgrade/Connection). Upstreams on this server's loopback:
#   127.0.0.1:18080  ssh -R tunnel from the device (fnav-core's remote listener, no localhost trust)
#   127.0.0.1:8095   fnav-relay: the position log; login and session while the device is offline

location = /fnadmin  { return 301 /fnadmin/admin/; }
location = /fnadmin/ { return 301 /fnadmin/admin/; }

# Static copy of the web UI (tools/remote.sh web): loads fast and still opens while the device is offline.
location ^~ /fnadmin/admin/ {
    alias /var/www/fnadmin/admin/;
    index index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
}
location ^~ /fnadmin/display/ {
    alias /var/www/fnadmin/display/;
    index index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
}

# Position log: always from the server.
location ^~ /fnadmin/api/tracking/ {
    proxy_pass http://127.0.0.1:8095;
    proxy_read_timeout 30s;
}

# Login, logout, session: the device while it is online, fnav-relay (same password and cookie) otherwise.
location = /fnadmin/api/login {
    limit_req zone=fnadmin_login burst=5 nodelay;
    limit_req zone=fnadmin_login_all burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:18080/api/login;
    proxy_read_timeout 30s;
    proxy_cookie_path / /fnadmin/;
    proxy_cookie_flags fnav_session secure;
    error_page 502 504 = @fnadmin_relay;
}
location = /fnadmin/api/logout {
    proxy_pass http://127.0.0.1:18080/api/logout;
    proxy_read_timeout 30s;
    proxy_cookie_path / /fnadmin/;
    proxy_cookie_flags fnav_session secure;
    error_page 502 504 = @fnadmin_relay;
}
location = /fnadmin/api/session {
    proxy_pass http://127.0.0.1:18080/api/session;
    proxy_read_timeout 30s;
    error_page 502 504 = @fnadmin_relay;
}
location @fnadmin_relay {
    proxy_pass http://127.0.0.1:8095;
}

# Live video (MPEG-TS), MJPEG and recording downloads: streamed through, never buffered on this server.
location ^~ /fnadmin/api/camera/ {
    proxy_pass http://127.0.0.1:18080/api/camera/;
    proxy_buffering off;
    proxy_read_timeout 1h;
    gzip off;
    error_page 502 504 = @fnadmin_relay;
}
location ^~ /fnadmin/api/recordings/file/ {
    proxy_pass http://127.0.0.1:18080/api/recordings/file/;
    proxy_buffering off;
    proxy_read_timeout 1h;
    gzip off;
    error_page 502 504 = @fnadmin_relay;
}

# Everything else of the API, WebSocket telemetry and map tiles: the device.
location ^~ /fnadmin/api/ {
    proxy_pass http://127.0.0.1:18080/api/;
    proxy_read_timeout 60s;
    client_max_body_size 2m;
    proxy_cookie_path / /fnadmin/;
    proxy_cookie_flags fnav_session secure;
    error_page 502 504 = @fnadmin_relay;
}
location = /fnadmin/ws {
    proxy_pass http://127.0.0.1:18080/ws;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}
location ^~ /fnadmin/tiles/ {
    proxy_pass http://127.0.0.1:18080/tiles/;
    proxy_read_timeout 30s;
}
location ^~ /fnadmin/ {
    return 404;
}
