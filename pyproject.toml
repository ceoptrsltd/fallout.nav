[project]
name = "fnav"
version = "0.1.0"
description = "fallout.nav: dashcam + navigation display for Raspberry Pi CM4"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "httpx>=0.26",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Only on the device (installed from apt / pip there):
# opencv-python-headless: fnav-watch (YuNet faces, the fallback person detector; numpy stays the apt one)
# ncnn: fnav-watch person detector NanoDet-Plus-m-1.5x 416 (one thread)
pi = ["smbus2>=0.4", "gpiozero>=2.0", "lgpio>=0.2", "pygeomag>=1.1", "gps>=3.19", "pyubx2>=1.2", "dbus-fast>=2.0",
      "opencv-python-headless>=4.10", "ncnn>=1.0.20261020"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.3", "Pillow>=10", "opencv-python-headless>=4.10",
       "ncnn>=1.0.20261020"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"
